name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The rendered half of the suite needs a browser to render into.
      - run: npx playwright install --with-deps chromium

      # A failing test or type error should stop the deploy, not ship.
      - run: npm run test
      - run: npm run lint

      # The server's copy of the scoring and the level data is generated and
      # committed, so it can be forgotten. Regenerate it and insist nothing
      # moved: a dirty tree here means someone changed the game and did not
      # run `npm run build:club`, and the club table would have gone on
      # scoring runs against the old rules.
      #
      # `npm test` deep-compares the two on level data and will usually catch
      # this first. This is the wider net — it covers the scoring internals as
      # well, which no behavioural test samples exhaustively.
      - name: Check the club bundle is not stale
        run: |
          npm run build:club
          git diff --exit-code -- supabase/functions/_shared/game.bundle.js \
            || {
              echo "::error file=supabase/functions/_shared/game.bundle.js::Stale. Run 'npm run build:club' and commit the result."
              exit 1
            }

      # The club table is compiled in, so the build needs the project's URL and
      # its publishable anon key. Unset — on a fork, say — the leaderboard is
      # simply not in the bundle and the game plays exactly as it always has.
      #
      # The anon key is public by design: it names the project and authorises
      # nothing. Row level security is what decides who may read and write. The
      # service role key is a different thing entirely and must never be here.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
